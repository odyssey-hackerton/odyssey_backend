upstream api {
    server api:8000;
}

# HTTP로 들어오면 HTTPS로 돌려보낸다.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# 사설 IP라 공인 인증서를 받을 수 없어 mkcert 인증서를 쓴다 (scripts/make-cert.sh).
# 인증서는 이미지에 넣지 않고 Compose가 서버의 certs/ 를 마운트한다.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # 사진 최대 4장 × 10MB + multipart 헤더
    client_max_body_size 41m;
    # 업로드 버퍼는 Compose의 메모리 파일시스템에만 둔다.
    client_body_temp_path /tmp/odyssey-client-body;

    # React 빌드 결과물 (frontend/ 를 이미지 빌드 때 빌드해서 넣는다)
    root /usr/share/nginx/html;
    index index.html;

    # index.html 은 매번 새로 받아야 새 배포가 바로 반영된다.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # 파일 이름에 내용 해시가 붙어 있어서 오래 캐시해도 안전하다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SSE: 버퍼링을 끄지 않으면 진행 이벤트가 모였다가 한꺼번에 도착한다.
    location ~ ^/api/jobs/[^/]+/events$ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # API 문서 (해커톤 중에는 열어두고, 공개 시연 전 막을지 결정)
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }
}

