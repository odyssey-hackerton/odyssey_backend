upstream api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # API 업로드 제한(10MB)보다 조금 크게
    client_max_body_size 11m;

    # React 빌드 결과물 (frontend/ 를 이미지 빌드 때 빌드해서 넣는다)
    root /usr/share/nginx/html;
    index index.html;

    # index.html 은 매번 새로 받아야 새 배포가 바로 반영된다.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # 파일 이름에 내용 해시가 붙어 있어서 오래 캐시해도 안전하다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SSE: 버퍼링을 끄지 않으면 진행 이벤트가 모였다가 한꺼번에 도착한다.
    location ~ ^/api/jobs/[^/]+/events$ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API 문서 (해커톤 중에는 열어두고, 공개 시연 전 막을지 결정)
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }
}

