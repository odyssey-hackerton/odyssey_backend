upstream api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # API 업로드 제한(10MB)보다 조금 크게
    client_max_body_size 11m;

    # 정적 프론트엔드 (빌드 결과물을 ./frontend 에 둔다)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE: 버퍼링을 끄지 않으면 진행 이벤트가 모였다가 한꺼번에 도착한다.
    location ~ ^/api/jobs/[^/]+/events$ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API 문서 (해커톤 중에는 열어두고, 공개 시연 전 막을지 결정)
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }
}

# HTTPS는 도메인이 정해지면 추가한다 (Let's Encrypt 인증서를 443 server 블록에 연결).
